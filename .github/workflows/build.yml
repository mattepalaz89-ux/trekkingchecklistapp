name: Build Trekking Checklist Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android scaffolding & preserving source files
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp lib/main.dart main.dart.bak
          flutter create --org com.matteopalazzi --project-name trekking_checklist --platforms android .
          mv pubspec.yaml.bak pubspec.yaml
          mv main.dart.bak lib/main.dart

      - name: Configure AndroidManifest, Package ID & Desugaring (API 36)
        run: |
          python3 - << 'EOF'
          import os, re

          # 1. Patch AndroidManifest.xml (Label + Permessi Notifiche)
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              manifest = f.read()

          manifest = manifest.replace('android:label="trekking_checklist"', 'android:label="Trekking Checklist"')
          perms = '''
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
          '''
          if "POST_NOTIFICATIONS" not in manifest:
              manifest = manifest.replace("<application", perms + "\n    <application", 1)

          receivers = '''
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
              </application>'''
          if "ScheduledNotificationReceiver" not in manifest:
              manifest = manifest.replace("</application>", receivers, 1)

          with open(manifest_path, "w") as f:
              f.write(manifest)

          # 2. Patch Gradle per CoreLibraryDesugaring e ID com.matteopalazzi.trekkingchecklist
          kts_path = "android/app/build.gradle.kts"
          groovy_path = "android/app/build.gradle"

          if os.path.exists(kts_path):
              with open(kts_path, "r") as f:
                  g = f.read()
              g = g.replace("com.matteopalazzi.trekking_checklist", "com.matteopalazzi.trekkingchecklist")
              g = g.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
              g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              with open(kts_path, "w") as f:
                  f.write(g)
          elif os.path.exists(groovy_path):
              with open(groovy_path, "r") as f:
                  g = f.read()
              g = g.replace("com.matteopalazzi.trekking_checklist", "com.matteopalazzi.trekkingchecklist")
              g = g.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
              g += '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n'
              with open(groovy_path, "w") as f:
                  f.write(g)
          EOF

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build APK (Test su Smartphone) & AAB (Google Play Store)
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload Pacchetti Android (APK + AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Trekking-Checklist-Android-Build
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
